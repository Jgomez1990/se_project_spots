<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A creative, modern website for the Spots project."
    />
    <meta name="author" content="Josuegomez" />
    <meta name="keywords" content="spots, project, web design, html, css" />

    <title>Spots</title>
    <link rel="stylesheet" href="pages/index.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="./images/spots-images/favicon.ico"
    />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="./images/spots-images/logo.svg"
          alt="Spots"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <img
            src="./images/spots-images/avatar/image-2.png"
            alt="Bessie Coleman"
            class="profile__avatar"
          />
          <div class="profile__info">
            <h1 class="profile__title">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button class="profile__edit-button" type="button">
              <img
                src="./images/spots-images/pencil.svg"
                alt="Edit"
                class="profile__edit-icon"
              />
            </button>
          </div>
          <button class="profile__add-button" type="button">
            <img
              src="./images/spots-images/add.svg"
              alt="New Post"
              class="profile__add-icon"
            />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>
          <template id="card-template">
            <li class="card">
              <img src="#" alt="" class="card__image" />
              <button class="card__delete-button" type="button"></button>
              <div class="card__description">
                <h2 class="card__title"></h2>
                <button class="card__like-button" type="button">
                  <img
                    src="./images/spots-images/like.svg"
                    alt="Like"
                    class="card__like-icon"
                  />
                </button>
              </div>
            </li>
          </template>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__text">2026 &copy; Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          ></button>
          <div class="modal__content">
            <h2 class="modal__title">Edit profile</h2>
            <form class="modal__form">
              <label for="profile-name-input" class="modal__label">
                Name
                <input
                  id="profile-name-input"
                  type="text"
                  class="modal__input"
                  placeholder="Type your name"
                  required
                />
              </label>
              <label for="profile-description-input" class="modal__label">
                Description
                <input
                  id="profile-description-input"
                  type="text"
                  class="modal__input"
                  placeholder="Describe yourself"
                  required
                />
              </label>
              <button type="submit" class="modal__submit-btn">Save</button>
            </form>
          </div>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          ></button>
          <div class="modal__content">
            <h2 class="modal__title">New post</h2>
            <form class="modal__form">
              <label for="card-image-input" class="modal__label">
                Image link
                <input
                  id="card-image-input"
                  type="url"
                  class="modal__input"
                  placeholder="Place a link to the picture"
                  required
                />
              </label>
              <label for="card-caption-input" class="modal__label">
                Caption
                <input
                  id="card-caption-input"
                  type="text"
                  class="modal__input"
                  placeholder="Type your caption"
                  required
                />
              </label>
              <button type="submit" class="modal__submit-btn">Save</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="modal" id="preview-modal">
      <div class="modal__preview-container">
        <button
          type="button"
          class="modal__close-btn modal__close-btn_type_preview"
          aria-label="Close modal"
        ></button>
        <img src="#" alt="" class="modal__preview-image" />
        <p class="modal__preview-caption"></p>
      </div>
    </div>
    <script src="./scripts/index.js"></script>
  </body>
</html>
